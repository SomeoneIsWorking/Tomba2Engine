# The 30fps control for Tomba! 2's shipped 60fps configuration. Tracked rather than generated,
# because a cadence claim with no control is a number rather than a measurement.
#
# WHY A CONTROL FILE. `tools/verify_fps60_cadence.py` reports presented frames per unit of guest
# progress. That ratio means nothing alone: 1.0 would read as "interpolation does nothing" and 2.0 as
# "it works", but 1.0 is ALSO what a product that computes midpoints and then presents at 30 Hz reports,
# and 2.0 is what a product that presents each update twice reports. Only a second leg with the feature
# OFF distinguishes those, so the tool runs BOTH and the difference between them is the result.
#
# This is byte-identical to tools/shipping_settings.ini except for `fps60`, and it is 4:3 so a width
# change cannot move the presented-frame count. The wide leg is a separate concern, measured by the
# picture comparator.
#
#   aspect=0  retail 4:3, so a width change cannot move the presented-frame count
#   fps60=0   the feature off, which is the control the shipped leg is read against
aspect=0
fps60=0
