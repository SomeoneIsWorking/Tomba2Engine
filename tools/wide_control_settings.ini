# The 16:9 leg of the aspect control pair. Tracked rather than generated, because a picture
# comparison with no named configuration on both sides is a difference count with no cause.
#
# WHY A PAIR. Any claim that a wide frame shows something a 4:3 frame does not — or hides something
# it does — is a claim about the DIFFERENCE, so both legs must be the same configuration in exactly
# one field. This file and tools/fps60_control_settings.ini are byte-identical except for `aspect`:
#
#   aspect=0   4:3, in fps60_control_settings.ini
#   aspect=1   16:9, here
#   fps60=0    BOTH legs, so the presented-frame path is identical and the one field that differs is
#              the one under test
#
# `PSXPORT_ASPECT` is not a CVar and does nothing; aspect is owned by the settings file, so pinning
# it means naming a tracked file. A run with PSXPORT_SETTINGS unset is configured by whichever
# untracked psxport_settings.ini sits beside the binary, and that file ships `aspect=3` (AUTO), which
# resolves to the SINK's aspect — so an unpinned headless run measures 4:3 while claiming to be wide.
# Read the product's own `render_width`, not `wide_engine`, to confirm which leg actually ran.
#
# The shipping player configuration is tools/shipping_settings.ini (aspect=1, fps60=1); this pair is
# an instrument, not the shipping default, and the difference is named in this header.
aspect=1
fps60=0
