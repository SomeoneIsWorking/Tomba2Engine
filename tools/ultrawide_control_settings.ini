# The 21:9 leg of the aspect pair. Tracked rather than generated, because the third aspect is the one
# a 4:3-vs-16:9 pair cannot reach, and that turned out to be the whole answer.
#
# WHY THIS FILE EXISTS. Tomba! 2's shipping player configuration ships `aspect=3` (ASPECT_AUTO), and
# AUTO resolves to the SINK's aspect — a real window, at the operator's monitor's shape. So the width the
# player is actually running is a function of their display, and it is not pinned by anything in the
# repository. The two widths a pair can name by hand are 4:3 (320) and 16:9 (428); the third
# ASPECT_* value this product supports is 21:9 (560), and a defect that only appears there is invisible
# to every capture taken at the other two — including a bisect whose whole job was to find it.
#
#   aspect=0   4:3  -> render_width=320   (tools/fps60_control_settings.ini)
#   aspect=1   16:9 -> render_width=428   (tools/wide_control_settings.ini, tools/shipping_settings.ini)
#   aspect=2   21:9 -> render_width=560   (this file)
#   aspect=3   AUTO  -> whatever the sink is; headless that is 4:3, which is why an agent run that
#                       leaves the knob alone measures 320 and calls it wide.
#
# fps60=0 here so the pair differs from the 4:3 control in exactly the aspect, matching
# tools/wide_control_settings.ini. The shipping player configuration is tools/shipping_settings.ini.
#
# MEASURED 2026-09-27 at present 1120 of replays/bugs/ingame-item-menu.pad: render_width is 560 here
# and 428 at aspect=1, and the in-game item menu's geometry is correct at BOTH while the extra lines
# appear only at this one. Read the product's own `render_width=` line to confirm which leg ran — passing
# the aspect is a claim about a file, and the printed width is a claim about the frame.
aspect=2
fps60=0
